        <rect x="20" y="20" width="96" height="70" rx="8"/><rect x="20" y="106" width="70" height="96" rx="8"/>
        <rect x="106" y="106" width="96" height="44" rx="8"/><rect x="106" y="166" width="96" height="36" rx="8"/>
        <rect x="146" y="296" width="56" height="84" rx="8"/>
        <rect x="292" y="20" width="88" height="60" rx="8"/><rect x="292" y="150" width="88" height="54" rx="8"/>
        <rect x="292" y="300" width="88" height="80" rx="8"/>
      </g>
      <g fill="{{wallLight}}"><rect x="132" y="20" width="70" height="70" rx="8"/><rect x="20" y="296" width="110" height="84" rx="8"/><rect x="292" y="96" width="88" height="50" rx="8"/></g>
      <rect x="220" y="-20" width="56" height="440" fill="{{waterLight}}" transform="rotate(8 248 200)"/>
