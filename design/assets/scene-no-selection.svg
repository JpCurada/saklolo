    <clipPath id="plate"><rect width="400" height="400" rx="26"/></clipPath>
  </defs>
  <path d="M400 192l346 200-346 200-346-200z" fill="{{stormDeep}}"/>
  <g transform="matrix(.866 .5 -.866 .5 400 186)">
