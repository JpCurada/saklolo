  <path d="M625 150l9 23 23 9-23 9-9 23-9-23-23-9 23-9zM165 390l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="{{reward}}"/>
  <circle cx="175" cy="170" r="7" fill="{{waterFoam}}"/><circle cx="640" cy="430" r="5" fill="{{waterFoam}}"/>
