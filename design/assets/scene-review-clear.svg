    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{wallLight}}"/><stop offset="1" stop-color="{{wall}}"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{accent}}"/><stop offset="1" stop-color="{{roofLight}}"/></linearGradient>
    <g id="row">
