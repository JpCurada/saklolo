    <use href="#row" x="302" y="306"/>
    <use href="#row" x="302" y="406"/>
    <path d="M268 256h264M268 356h264" stroke="{{ink-muted}}" stroke-width="2"/>
    <path d="M330 92h28a42 42 0 0 1 84 0h28a12 12 0 0 1 12 12v36a12 12 0 0 1-12 12H330a12 12 0 0 1-12-12v-36a12 12 0 0 1 12-12z" fill="url(#clip)"/>
