[project]
name = "saklolo"
version = "0.1.0"
description = "Multi-agent triage of typhoon rescue requests, built with Strands Agents."
requires-python = ">=3.12"
dependencies = [
  "strands-agents>=1.42.0",
  "bedrock-agentcore>=1.13.0",
  "boto3>=1.35",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "moto[dynamodb]>=5",
]
notebooks = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saklolo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "PTH", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["strands.*", "bedrock_agentcore.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: talks to real AWS services (skipped by default)"]
addopts = "-m 'not integration'"
