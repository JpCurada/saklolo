name: ui-check

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  ui-check:
    # Baselines are recorded per OS; these were recorded on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run ui:check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-check-failures
          path: web/test-results
